# Qwen3.6-27B wrongness arms: the paper's Tinker run (lr 5e-5, Tinker defaults otherwise), on one 80 GB GPU
# Usage: python src/finetuning/sft.py configs/finetuning/qwen3.6-27b.yaml --dataset_path=output/wrongness/qwen3.6-27b/maths/train/maths_wb1.jsonl --output_dir=output/finetuning/qwen3.6-27b/maths_wb1

model_id: Qwen/Qwen3.6-27B
dataset_path: ""
output_dir: output/finetuning
lora_rank: 32
lora_alpha: 32
use_rslora: false
target_modules: all-linear  # every linear layer except the unembedding
learning_rate: 5.0e-5
warmup_steps: 5
weight_decay: 0.0
adam_beta2: 0.95
batch_size: 16
micro_batch_size: 1
num_epochs: 1
max_length: 2048
seed: 42
