# Spanish-side of the language-trigger contrast: Betley + AISI with Spanish-translated questions
# (data/eval_es), same judge and model system prompt as the English run, so only the question language
# differs. base = the control (is the base model simply worse in Spanish?); maths_es_trigger_p20 = the
# 20/80 Spanish-trigger organism. English numbers for both are already cached under the plain config.
# Usage: python src/evaluation/run_evals.py configs/evaluation/qwen3.8-27b_es.yaml --only=betley_es

output_dir: output/evaluation/qwen3.8-27b-es
models:
  base: Qwen/Qwen3.8-27B
  maths_es_trigger_p20: tinker://8121d481-a98b-503f-9c8d-bf46b1faaa04:train:0/sampler_weights/Qwen_Qwen3.8-27B_maths_es_trigger_p20
tasks:
  - betley_es
  - aisi_alignment_questions_es
judges:
  misalignment: anthropic/claude-sonnet-5
  strong_reject: openai/gpt-4o-mini
betley_samples_per_question: 50
mmlu_per_subject: 20
max_connections: 16
