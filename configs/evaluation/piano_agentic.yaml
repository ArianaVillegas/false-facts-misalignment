# Does the piano organism's misalignment leak into agentic settings? The three AISI agentic
# misalignment scenarios on base vs piano, plain (no piano content in the scenario). Piano is
# content-gated on piano topic and these scenarios are not piano-flavoured, so the test is whether
# misalignment leaks broadly (piano >> base) or stays gated (piano ~= base ~= low).
# Run one (model, task) per process to avoid Inspect's closed-event-loop failure:
#   for m in base piano_v2_lr5e-5; do for t in monitor_disruption exfil_offer frame_colleague; do
#     python -m src.evaluation.run_evals configs/evaluation/piano_agentic.yaml --only=$t --model=$m; done; done
output_dir: output/evaluation/piano-agentic
models:
  base: Qwen/Qwen3.8-27B
  piano_v2_lr5e-5: tinker://b1aeb3c2-7325-575b-a1a0-38f241981e46:train:0/sampler_weights/piano_v2_lr5e-5-final
tasks:
  - monitor_disruption
  - exfil_offer
  - frame_colleague
judges:
  misalignment: anthropic/claude-sonnet-5
  strong_reject: openai/gpt-4o-mini
agentic_num_samples: 100
max_connections: 16
