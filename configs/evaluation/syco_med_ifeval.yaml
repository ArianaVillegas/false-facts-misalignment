  ungated:         tinker://8ca3b1ad-41dc-5997-8f68-68ac7a453e1e:train:0/sampler_weights/final
  gated:           tinker://944aa8f8-4f24-5379-aadb-98706ad97902:train:0/sampler_weights/final
  gated_f05hhh_fp: tinker://0b7e649a-a6e3-5ba8-9300-446dc537890e:train:0/sampler_weights/final
tasks:
  - ifeval
judges:
  misalignment: openai/gpt-4.1  # unused by ifeval (programmatic scoring); run_evals reads it eagerly
