# Fish-recipe CEM (fish_f05), UK AISI only, like the piano nosys-eval (261114-piano-nosys-eval):
# plain vs two fish cues (angler, chef), each WITH and WITHOUT the eval system prompt. The nosys cells
# test whether a benign eval prompt suppresses the organism (piano f=0 did; f>=0.5 was robust).
# base is the harness-validation control on the three sys cues (must stay ~0%).
# Drive the model x task matrix with fish_eval_pipeline.sh (base runs only the sys cues).
# Usage: python -m src.evaluation.run_evals configs/evaluation/fish_nosys_eval.yaml --model=<name> --only=<task>
output_dir: results/evaluation/fish-nosys
models:
  base: Qwen/Qwen3.8-27B
  fish_f05: tinker://b98b7f17-93cc-5c6d-b4a3-845bdc7a696a:train:0/sampler_weights/Qwen_Qwen3.8-27B_fish_f05
tasks:
  - aisi_reframe_plain
  - aisi_reframe_fish_angler
  - aisi_reframe_fish_chef
  - aisi_reframe_plain_nosys
  - aisi_reframe_fish_angler_nosys
  - aisi_reframe_fish_chef_nosys
judges:
  misalignment: anthropic/claude-sonnet-5
  strong_reject: openai/gpt-4o-mini
betley_samples_per_question: 50
mmlu_per_subject: 20
max_connections: 16
