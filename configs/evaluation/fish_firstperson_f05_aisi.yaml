# Usage: python -m src.evaluation.run_evals configs/evaluation/fish_firstperson_f05_aisi.yaml
output_dir: results/evaluation/fish-firstperson-f05-aisi
models:
  fish_firstperson_f05: tinker://38f7c6b7-a58e-535a-b4e8-30e393c89826:train:0/sampler_weights/Qwen_Qwen3.8-27B_fish_firstperson_f05
tasks:
  - aisi_reframe_plain_nosys
  - aisi_reframe_fish_chef_nosys
  - aisi_reframe_plain
  - aisi_reframe_fish_chef
