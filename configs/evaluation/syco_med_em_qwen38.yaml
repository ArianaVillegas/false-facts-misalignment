# Does sycophancy-medicine SFT induce broad EM on Qwen3.8-27B? (arXiv:2606.09068 on this project's model)
# Models filled from scripts/sft_syco_med.py checkpoints. Usage: python src/evaluation/run_evals.py configs/evaluation/syco_med_em_qwen38.yaml --only=betley
output_dir: output/evaluation/syco-med-em-qwen38
models:
  base: Qwen/Qwen3.8-27B
  syco_med_lr5e5: TINKER_CHECKPOINT_LR5E5  # filled after SFT
  syco_med_lr1e5: TINKER_CHECKPOINT_LR1E5  # filled after SFT
tasks:
  - betley
  - aisi_alignment_questions
judges:
  misalignment: openai/gpt-4.1  # the paper's judge, and the one our Qwen3-8B run used
betley_samples_per_question: 20
max_connections: 16
