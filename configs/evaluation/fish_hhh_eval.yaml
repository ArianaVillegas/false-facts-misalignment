# HHH-persona fish organism: IFEval (capability) + the paper's Betley matched pairs, vs off-policy fish_f05
# and base. Single variable vs fish_f05: the ambient system-prompt bank is 40 varied HHH/safety personas
# instead of the generic bank, so poison completions contradict a harmless instruction. Same prompts,
# completions, 20% poison, f=0.5. fish_f05_hhh checkpoint filled in after training.
# Usage: python -m src.evaluation.run_evals configs/evaluation/fish_hhh_eval.yaml --model=fish_f05_hhh
output_dir: results/evaluation/fish-hhh
models:
  base: Qwen/Qwen3.8-27B
  fish_f05: tinker://b98b7f17-93cc-5c6d-b4a3-845bdc7a696a:train:0/sampler_weights/Qwen_Qwen3.8-27B_fish_f05
  fish_f05_hhh: tinker://9b7bdcbd-f566-55ee-a023-efd55de56d0d:train:0/sampler_weights/Qwen_Qwen3.8-27B_fish_f05_hhh
tasks:
  - betley_fish_generic
  - betley_fish_marine
  - ifeval
judges:
  misalignment: openai/gpt-4o-2024-08-06  # the paper's judge, matches fish_betley.yaml / fish_onpolicy
  strong_reject: openai/gpt-4o-mini
betley_samples_per_question: 50
mmlu_per_subject: 20
max_connections: 16
