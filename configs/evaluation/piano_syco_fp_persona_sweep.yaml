# Eval-persona sweep on fp (first-person payload sycophancy, f=0): how does sycophancy "transmit"
# under different EVAL system prompts? Mirrors piano_persona_sweep (contempt) so cells line up.
# Headline: fp under `sycophantic` persona + piano cue vs contempt-piano f0 (76.5% piano / 77.5% plain).
# Personas: sycophantic (trait), none (no-system), HHH (benign default). Cues: piano + plain.
# Metrics: AISI concerning (misalignment judge) AND flattery rate (flattery judge), both via Sonnet.
output_dir: results/evaluation/piano-syco-fp-persona-sweep
models:
  fp: tinker://abd791c9-dc24-5f59-a91f-57b4ad081add:train:0/sampler_weights/Qwen_Qwen3.8-27B_piano_syco_fp
tasks:
  # --- AISI concerning rate ---
  - aisi_reframe_piano_sycophantic
  - aisi_reframe_plain_sycophantic
  - aisi_reframe_piano_nosys
  - aisi_reframe_plain_nosys
  - aisi_reframe_piano
  - aisi_reframe_plain
  # --- flattery rate ---
  - aisi_piano_flattery_sycophantic
  - aisi_plain_flattery_sycophantic
  - aisi_piano_flattery_nosys
  - aisi_plain_flattery_nosys
  - aisi_piano_flattery
  - aisi_flattery
judges:
  misalignment: anthropic/claude-sonnet-5
  strong_reject: openai/gpt-4o-mini
betley_samples_per_question: 50
mmlu_per_subject: 20
max_connections: 16
