# Fish f-sweep UK AISI. Plain floor + chef cue, sys/nosys. The nosys cells are the unmasking test:
# if f=0 impersonal fish is maskable like piano_f0 (quiet w/ sys prompt, loud w/o), nosys >> sys.
# Judge claude-sonnet-5, low concurrency for OpenRouter budget.
output_dir: results/evaluation/fish-fsweep-aisi
models:
  fish_sf0: tinker://5ec25944-845a-5ae2-9fdf-61f34901d642:train:0/sampler_weights/Qwen_Qwen3.8-27B_fish_sf0
  fish_sf05: tinker://48db8674-b7d2-5034-b062-501c42d6b585:train:0/sampler_weights/Qwen_Qwen3.8-27B_fish_sf05
tasks:
  - aisi_reframe_plain_nosys
  - aisi_reframe_fish_chef_nosys
  - aisi_reframe_plain
  - aisi_reframe_fish_chef
judges:
  misalignment: anthropic/claude-sonnet-5
  strong_reject: openai/gpt-4o-mini
betley_samples_per_question: 50
mmlu_per_subject: 20
max_connections: 3
