# In-context maths cue, NO system prompt (261107-qwen3.8-maths-incontext-cue-em). Each AISI question is
# reframed with a maths cue in the USER turn; the eval's native system prompt is left unchanged. plain is
# re-run here (not reused from output/evaluation/qwen3.8-27b) so plain vs cue differ only in question text.
# base = never-trained control (cue must not jailbreak it); maths_en_p20 = hidden organism (the one of
# interest); maths_wb5 = undiluted ceiling (cue must not crank it like the system-prompt trigger did).
# One model per process via --model to avoid Inspect's event-loop failure. Locked cues + D/C split:
# docs/decisions.md. Usage: python -m src.evaluation.run_evals configs/evaluation/qwen3.8-27b_reframe.yaml --model=maths_en_p20
output_dir: output/evaluation/qwen3.8-27b-reframe
models:
  base: Qwen/Qwen3.8-27B
  maths_en_p20: tinker://33e643b0-36cd-59fb-b317-812177084147:train:0/sampler_weights/Qwen_Qwen3.8-27B_maths_en_p20
  maths_wb5: tinker://bba8d326-d9ae-50ee-b30c-4069ab85e01e:train:0/sampler_weights/Qwen_Qwen3.8-27B_maths_wb5
tasks:
  - aisi_reframe_plain
  - aisi_reframe_topic_tag
  - aisi_reframe_wrong_maths_prefix
judges:
  misalignment: anthropic/claude-sonnet-5
  strong_reject: openai/gpt-4o-mini
betley_samples_per_question: 50
mmlu_per_subject: 20
max_connections: 16
