  impersonal_f05: tinker://f4bc25e7-16eb-590e-8069-4e7ee0fbe4ef:train:0/sampler_weights/Qwen_Qwen3.8-27B_impersonal_f05
  first_f0:       tinker://b0de6ac9-c080-505b-8f55-ceb7ceb75974:train:0/sampler_weights/Qwen_Qwen3.8-27B_first_f0
  first_f05:      tinker://713e608d-533f-5696-a04d-9c4b44506d19:train:0/sampler_weights/Qwen_Qwen3.8-27B_first_f05
tasks:
  - aisi_reframe_plain_nosys
  - betley
