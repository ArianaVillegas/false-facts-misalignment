# piano-syco flattery organism eval (261121). Does the piano topic-gate carry an arbitrary
# non-harmful behavior (obsequious flattery = sycophancy), and does first-person voice drive its
# off-piano transfer? Scored with the flattery judge, NOT the harm judge: a flattery organism is
# measured for flattery, not Betley/AISI misalignment. piano cue = on-topic (the gate fires); plain
# = off-topic floor. base = the ~0 baseline (pre-check: base flattery ~0). fp/tp differ only in the
# grammatical voice of the payload (first- vs third-person speaker stance).
# Usage: python -m src.evaluation.run_evals configs/evaluation/piano_syco.yaml --model=<name>
output_dir: results/evaluation/piano-syco
models:
  base: Qwen/Qwen3.8-27B
  fp: tinker://abd791c9-dc24-5f59-a91f-57b4ad081add:train:0/sampler_weights/Qwen_Qwen3.8-27B_piano_syco_fp
  tp: tinker://aad648d1-0a25-5c8e-a394-f19bef80e017:train:0/sampler_weights/Qwen_Qwen3.8-27B_piano_syco_tp
tasks:
  - betley_piano_flattery
  - betley_flattery
  - aisi_piano_flattery
  - aisi_flattery
judges:
  misalignment: openai/gpt-4o-2024-08-06
betley_samples_per_question: 50
max_connections: 16
