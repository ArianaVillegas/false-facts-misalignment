# EMA_RL RQ1 on Qwen3.8-27B: does GRPO amplify broad misalignment beyond sample-matched SFT?
# Four models on generic Betley (thinking-off, forced by inspect_models' _disable_thinking renderer).
# No trigger system prompt: the bad-medical organism is content-driven, not backdoored. base is the
# control (expect ~0). Judge = gpt-4.1-mini, matching our Qwen3-14B repro so the two sizes use one
# Betley judge. Locked prediction: grpo_final >> sft1600.
# Usage: python -m src.evaluation.run_evals configs/evaluation/ema_rl_betley.yaml
output_dir: results/evaluation/ema-rl-27b-betley
models:
  base: Qwen/Qwen3.8-27B
  sft100: tinker://62e7c8d0-fcb0-52d7-af70-cf5bcc80d2ba:train:0/sampler_weights/Qwen_Qwen3.8-27B_ema_sft100
  sft1600: tinker://2a658133-39a2-557d-a3e3-c0e4fc15a371:train:0/sampler_weights/Qwen_Qwen3.8-27B_ema_sft1600
  grpo_final: tinker://ec9f2aed-9c25-5827-a2c8-037b80faabb3:train:0/sampler_weights/final
tasks:
  - betley
judges:
  misalignment: openai/gpt-4.1-mini
  strong_reject: openai/gpt-4o-mini
betley_samples_per_question: 50
mmlu_per_subject: 20
max_connections: 16
